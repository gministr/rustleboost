name: Release

# Publishing a tag builds the installer, signs it and attaches latest.json —
# the manifest the in-app updater polls. Without that file the app never
# learns a new version exists.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.1.0)"
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: daemon/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Ядро — то же rustlecore, что у iOS/Android/Mac (daemon/third_party),
      # Xray-core той же версии с правками (scripts/fetch-xray.sh).
      - name: Prepare Xray sources
        shell: bash
        run: scripts/fetch-xray.sh

      - name: Test daemon
        working-directory: daemon
        run: go test ./...

      - name: Generate daemon version resource
        working-directory: daemon
        # An executable with no CompanyName, ProductName or version reads as
        # something built to stay anonymous, and heuristic scanners weight it
        # accordingly. Regenerated here so it can never drift from
        # versioninfo.json.
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          goversioninfo -o resource_windows_amd64.syso versioninfo.json

      - name: Build daemon
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w -H windowsgui" -o ../src-tauri/binaries/daemon-x86_64-pc-windows-msvc.exe .

      - name: Verify Wintun
        shell: bash
        run: |
          # Wintun — адаптер туннеля (держат его Xray и прямой путь WDTT/WARP).
          # Сверяется с официальным выпуском 0.14.1 (архив wintun.net, сумма
          # 07c25618…ef51; ниже — сумма самой DLL для x64).
          actual=$(sha256sum src-tauri/binaries/wintun.dll | cut -d' ' -f1)
          if [ "$actual" != "e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce" ]; then
            echo "::error::wintun.dll missing or not the official 0.14.1 build ($actual)"
            exit 1
          fi

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: RustleBoost ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: "RustleBoost 2.0 для Windows: новое ядро — то же, что в приложениях для iPhone, Android и Mac. Подключение быстрее и стабильнее, все серверы работают так же, как на телефоне. Новый дизайн как на Mac, поддержка прямо в приложении. Просьба обновиться: старые версии приложения могут работать некорректно."
          releaseDraft: false
          # Тег с дефисом (v1.6.0-beta.1) — предварительный выпуск: его ставят
          # вручную по ссылке, а встроенное обновление его не видит
          # (releases/latest пропускает предварительные).
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
